name: Deploy NodeJS Application to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            script: |
             cd /home/ubuntu/180_Days_learning_advance_backend


             git pull
             cd Day-3-github-action
           
             docker compose up -d --build