name: Deploy NodeJS Application to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo git -C /root/180_Days_learning_advance_backend pull

            cd /root/180_Days_learning_advance_backend/Day-3-github-action

            sudo docker compose up -d --build